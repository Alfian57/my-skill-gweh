name: Publish npm package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-info:
    name: Validate release tag and repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require tag matching package.json version
        id: release
        run: node scripts/verify-release.mjs

  verify:
    name: Validate package on supported platforms
    needs: release-info
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified tarball to npm
    needs: [release-info, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.16.0
      - run: npm ci
      - name: Build release tarball
        id: package
        run: npm run package
      - name: Verify installable release tarball
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm run test:package -- "$TARBALL"
      - name: Check whether the exact package is already published
        id: registry
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: node scripts/check-publication.mjs "$TARBALL"
      - name: Store release package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-skill-gweh-${{ needs.release-info.outputs.version }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish with OIDC and provenance
        if: steps.registry.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ needs.release-info.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --access public --provenance --ignore-scripts --tag "$DIST_TAG"
